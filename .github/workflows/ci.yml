name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: validate all SKILL.md files
        run: |
          found=0
          for f in skills/*/SKILL.md; do
            found=1
            name=$(basename "$(dirname "$f")")
            head -1 "$f" | grep -qx -- '---' || { echo "$f: no YAML frontmatter fence"; exit 1; }
            grep -qx "name: $name" "$f" || { echo "$f: frontmatter name must be '$name'"; exit 1; }
            grep -q '^description: ' "$f" || { echo "$f: missing description"; exit 1; }
            echo "$f OK"
          done
          test "$found" = 1 || { echo "no skills found"; exit 1; }
          # the core skill must keep an install instruction (accept any canonical form)
          grep -Eq 'npx (create-webclaw|-y @webclaw/mcp|skills add )' skills/webclaw/SKILL.md || { echo "webclaw skill: missing install instruction"; exit 1; }
      - name: syntax-check bundled scripts
        run: |
          for s in skills/*/scripts/*.py; do
            [ -e "$s" ] || continue
            python3 -m py_compile "$s" && echo "$s OK"
          done
      - name: test bundled scripts
        run: python3 -m unittest discover -s tests -v
