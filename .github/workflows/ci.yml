name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate SKILL.md
        run: |
          f=skills/webclaw/SKILL.md
          test -f "$f" || { echo "missing $f"; exit 1; }
          head -1 "$f" | grep -qx -- '---' || { echo "no YAML frontmatter fence"; exit 1; }
          grep -qx 'name: webclaw' "$f" || { echo "missing 'name: webclaw'"; exit 1; }
          grep -q '^description: ' "$f" || { echo "missing description"; exit 1; }
          grep -q 'npx create-webclaw' "$f" || { echo "missing install instruction"; exit 1; }
          echo "SKILL.md OK"
